# Optional private node transport. No socket, worlds, identity DB or CA private key.
services:
  api:
    environment:
      CRAFTLAYER_NODE_CONTROL_PUBLIC_KEY: ${CRAFTLAYER_NODE_CONTROL_PUBLIC_KEY:?Configure the control signing public key}
  node-control:
    networks: [default, edge]
    build: { context: ., dockerfile: infra/images/Dockerfile, target: api }
    command: [node, dist/node-main.js]
    user: "${CRAFTLAYER_HOST_UID:?Set key owner UID}:${CRAFTLAYER_HOST_GID:?Set key owner GID}"
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    pids_limit: 64
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://craftlayer_runtime:${RUNTIME_PASSWORD:?Configure local credentials}@postgres:5432/craftlayer
      CRAFTLAYER_NODE_TLS_DIRECTORY: /run/secrets/node-control
      CRAFTLAYER_NODE_BIND_HOST: container-private
    ports: ["127.0.0.1:${CRAFTLAYER_NODE_HTTP_PORT:-9443}:9443"]
    volumes:
      - type: bind
        source: ${CRAFTLAYER_NODE_TLS_CONFIG_DIR:?Choose protected node TLS files}/server.key
        target: /run/secrets/node-control/server.key
        read_only: true
      - type: bind
        source: ${CRAFTLAYER_NODE_TLS_CONFIG_DIR:?Choose protected node TLS files}/server.crt
        target: /run/secrets/node-control/server.crt
        read_only: true
      - type: bind
        source: ${CRAFTLAYER_NODE_TLS_CONFIG_DIR:?Choose protected node TLS files}/ca.crt
        target: /run/secrets/node-control/ca.crt
        read_only: true
      - type: bind
        source: ${CRAFTLAYER_NODE_TLS_CONFIG_DIR:?Choose protected node TLS files}/control.key
        target: /run/secrets/node-control/control.key
        read_only: true
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'const s=require("net").connect(9443,require("os").hostname());s.setTimeout(2000);s.once("connect",()=>{s.end();process.exit(0)});s.once("error",()=>process.exit(1));s.once("timeout",()=>process.exit(1));',
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    stop_grace_period: 10s
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: 10m, max-file: "3" } }
