# Opt-in operator-managed provider access; default Compose has no key files or egress.
services:
  api:
    user: "${CRAFTLAYER_HOST_UID:?Run pnpm setup:providers}:${CRAFTLAYER_HOST_GID:?Run pnpm setup:providers}"
    networks: [default, provider-egress]
    environment:
      CRAFTLAYER_PROVIDER_KEY_FILE: /run/secrets/providers/provider-keys.json
      CRAFTLAYER_PROVIDER_POLICY_FILE: /run/secrets/providers/provider-policy.json
    volumes:
      # Directory mount permits atomic replacement of protected key/policy files.
      - ./.secrets:/run/secrets/providers:ro
networks:
  provider-egress: {}
