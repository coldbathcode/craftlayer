name: craftlayer
x-hardening: &hardening
  init: true
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  pids_limit: 128
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }
x-runtime: &runtime
  NODE_ENV: production
  CRAFTLAYER_BIND_HOST: 0.0.0.0
  DATABASE_URL: postgres://craftlayer_runtime:${RUNTIME_PASSWORD:?Run pnpm setup:local}@postgres:5432/craftlayer
  REDIS_URL: redis://:${REDIS_PASSWORD:?Run pnpm setup:local}@redis:6379
services:
  postgres:
    <<: *hardening
    build: { context: ./infra/postgres }
    user: postgres
    environment:
      POSTGRES_USER: craftlayer_admin
      POSTGRES_DB: craftlayer
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup:local}
      MIGRATOR_PASSWORD: ${MIGRATOR_PASSWORD:?Run pnpm setup:local}
      RUNTIME_PASSWORD: ${RUNTIME_PASSWORD:?Run pnpm setup:local}
      IDENTITY_PASSWORD: ${IDENTITY_PASSWORD:?Run pnpm setup:local}
    volumes: [postgres-data:/var/lib/postgresql]
    mem_limit: 512m
    healthcheck:
      test:
        [CMD, pg_isready, -h, 127.0.0.1, -U, craftlayer_admin, -d, craftlayer]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  redis:
    <<: *hardening
    image: redis:8-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    user: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run pnpm setup:local}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Run pnpm setup:local}
    command:
      [
        sh,
        -c,
        'umask 077; printf "bind 0.0.0.0\nappendonly yes\ndir /data\nrequirepass %s\n" "$$REDIS_PASSWORD" > /tmp/redis.conf; exec redis-server /tmp/redis.conf',
      ]
    read_only: true
    tmpfs: [/tmp]
    volumes: [redis-data:/data]
    mem_limit: 128m
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  provision:
    <<: *hardening
    build: { context: ., dockerfile: infra/images/Dockerfile, target: migrate }
    command: [node, dist/provision.js]
    environment:
      PROVISION_DATABASE_URL: postgres://craftlayer_admin:${POSTGRES_PASSWORD:?Run pnpm setup:local}@postgres:5432/craftlayer
      IDENTITY_PASSWORD: ${IDENTITY_PASSWORD:?Run pnpm setup:local}
    depends_on: { postgres: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    restart: "no"
  migrate:
    <<: *hardening
    build: { context: ., dockerfile: infra/images/Dockerfile, target: migrate }
    environment:
      MIGRATION_DATABASE_URL: postgres://craftlayer_migrator:${MIGRATOR_PASSWORD:?Run pnpm setup:local}@postgres:5432/craftlayer
    depends_on: { provision: { condition: service_completed_successfully } }
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    restart: "no"
  api:
    <<: *hardening
    build: { context: ., dockerfile: infra/images/Dockerfile, target: api }
    environment:
      <<: *runtime
      AUTH_DATABASE_URL: postgres://craftlayer_identity:${IDENTITY_PASSWORD:?Run pnpm setup:local}@postgres:5432/craftlayer
      CRAFTLAYER_BOOTSTRAP_TOKEN: ${CRAFTLAYER_BOOTSTRAP_TOKEN:?Run pnpm setup:local}
      CRAFTLAYER_RECOVERY_TOKEN: ${CRAFTLAYER_RECOVERY_TOKEN:?Run pnpm setup:local}
      CRAFTLAYER_CSRF_SECRET: ${CRAFTLAYER_CSRF_SECRET:?Run pnpm setup:local}
      CRAFTLAYER_PUBLIC_URL: ${CRAFTLAYER_PUBLIC_URL:-http://127.0.0.1:3000}
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:4000/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    stop_grace_period: 10s
    restart: unless-stopped
  worker:
    <<: *hardening
    build: { context: ., dockerfile: infra/images/Dockerfile, target: worker }
    environment:
      NODE_ENV: production
      CRAFTLAYER_BIND_HOST: 0.0.0.0
      REDIS_URL: redis://:${REDIS_PASSWORD:?Run pnpm setup:local}@redis:6379
      CRAFTLAYER_WORKER_API_ORIGIN: http://api:4000
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      api: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 256m
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:4001/health/ready").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    stop_grace_period: 10s
    restart: unless-stopped
  web:
    <<: *hardening
    networks: [default, edge]
    build: { context: ., dockerfile: infra/images/Dockerfile, target: web }
    ports: ["127.0.0.1:${CRAFTLAYER_HTTP_PORT:-3000}:3000"]
    depends_on: { api: { condition: service_healthy } }
    read_only: true
    tmpfs: [/tmp]
    mem_limit: 512m
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          'fetch("http://127.0.0.1:3000/health/live").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 5s
      timeout: 4s
      retries: 12
    stop_grace_period: 10s
    restart: unless-stopped
volumes:
  postgres-data:
  redis-data:
networks:
  default:
    internal: true
  edge: {}
