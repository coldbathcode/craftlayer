name: Foundation checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: foundation-${{ github.ref }}
  cancel-in-progress: true
jobs:
  foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      CI: "1"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - run: pnpm test:db
      - run: pnpm setup:local && pnpm compose:check
      - run: pnpm stack:up
      - run: pnpm check:stack
      - run: pnpm test:offline
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm test:identity-ui
        env:
          CRAFTLAYER_BOOTSTRAP_TOKEN: fixture-must-be-overridden-by-isolated-harness
      - run: pnpm test:provider-stack
      - run: pnpm test:runtime-stack
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: browser-report
          path: |
            playwright-report
            test-results
          retention-days: 7
      - run: docker compose down
        if: always() && hashFiles('.env') != ''
